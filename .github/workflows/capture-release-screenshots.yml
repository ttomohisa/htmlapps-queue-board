name: Capture v1.0.0 release screenshots

on:
  push:
    branches:
      - release/v1.0.0

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: release/v1.0.0
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Install one-time browser test tools
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP "queue-board-release-browser"
          New-Item -ItemType Directory -Force -Path $toolRoot | Out-Null
          Copy-Item ./scripts/capture-release-screenshots.mjs (Join-Path $toolRoot "capture-release-screenshots.mjs")
          Push-Location $toolRoot
          npm init -y | Out-Null
          npm install playwright@1.55.0 --save-exact
          npx playwright install chromium firefox webkit
          Pop-Location

      - name: Run browser smoke tests and capture screenshots
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP "queue-board-release-browser"
          Push-Location $toolRoot
          node ./capture-release-screenshots.mjs
          Pop-Location

      - name: Commit release screenshots
        shell: pwsh
        run: |
          git add assets/screenshot.png assets/screenshot-en.png assets/screenshot-mobile.png
          if (-not (git diff --cached --quiet)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: capture Queue Board v1.0.0 screenshots"
            git push origin HEAD:release/v1.0.0
          } else {
            Write-Host "Screenshots are unchanged."
          }
